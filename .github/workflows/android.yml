name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  # Der Release-Schritt legt den APK-Anhang ab.
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Wird zu versionCode. Muss steigen, sonst lehnt Android das Update als
  # Rueckschritt ab.
  VERSION_CODE: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew ausfuehrbar machen
        run: chmod +x ./gradlew

      - name: Unit-Tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: APK bauen
        run: ./gradlew --no-daemon assembleRelease

      - name: Lint
        run: ./gradlew --no-daemon lintDebug
        continue-on-error: true

      - name: APK benennen und Signatur pruefen
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"
          # Die Signatur ist der ganze Zweck der Uebung - lieber hier merken
          # als erst auf dem Telefon.
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "dist/$APK_NAME"
        env:
          APK_NAME: lokaler-live-chat.apk

      - name: APK als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: lokaler-live-chat-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      # Rollendes Release, damit der Download-Link im README stabil bleibt.
      - name: Release aktualisieren
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: dev-latest
        run: |
          NOTES=$(printf '%s\n' \
            "Automatisch gebauter Entwicklungsstand aus \`${GITHUB_REF_NAME}\`." \
            "" \
            "- Version: 0.2.${VERSION_CODE} (versionCode ${VERSION_CODE})" \
            "- Commit: ${GITHUB_SHA}" \
            "- Nur **arm64-v8a**" \
            "- Mit dem festen Schluessel aus dem Repo signiert, Updates gehen also" \
            "  ueber den vorigen Stand - ohne Datenverlust." \
            "- Textmodell: LiteRT-LM, \`.litertlm\`-Datei separat laden" \
            "" \
            "Dieses Release wird bei jedem Push auf den Entwicklungszweig ersetzt.")
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" dist/*.apk \
            --title "Lokaler Live-Chat - Entwicklungsstand" \
            --notes "$NOTES" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Testberichte hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 7
