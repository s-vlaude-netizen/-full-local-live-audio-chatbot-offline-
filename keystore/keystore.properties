# Signaturschluessel dieses Projekts - bewusst mit im Repo.
#
# Grund: der CI baut bei jedem Push ein neues APK. Ohne festen Schluessel
# signiert jeder Lauf mit einem anderen automatisch erzeugten Debug-Schluessel,
# und Android verweigert dann die Installation ueber den vorigen Stand. Man
# muesste jedes Mal deinstallieren und verloere Einstellungen und Modell.
#
# Der Preis: wer diese Datei hat, kann ein APK bauen, das Geraete als dieselbe
# App annehmen - also jeder, der das Repo liest. Siehe README.
storeFile=keystore/livechat.jks
storePassword=livechat
keyAlias=livechat
keyPassword=livechat
